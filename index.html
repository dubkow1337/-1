<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🥔 Прыгающая Картошка</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; width: 100%;
    background: radial-gradient(circle at 50% 30%, #2b2b4a, #12121f);
    display: flex; justify-content: center; align-items: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none;
  }
  #game {
    position: relative; width: 800px; height: 500px;
    background: linear-gradient(#87CEEB 0%, #B0E2FF 60%, #E0F6FF 100%);
    border-radius: 20px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 0 0 3px rgba(255,255,255,0.3);
    flex-shrink: 0; transform-origin: center center;
  }
  #sun { position: absolute; top: 20px; right: 30px; font-size: 60px;
    filter: drop-shadow(0 0 20px rgba(255,220,0,0.8)); z-index: 1; }
  #cloud1, #cloud2 { position: absolute; font-size: 50px; opacity: 0.9; z-index: 1; }
  #cloud1 { top: 50px; animation: drift 25s linear infinite; }
  #cloud2 { top: 120px; animation: drift 35s linear infinite; animation-delay: -10s; }
  @keyframes drift { from { left: 100%; } to { left: -150px; } }

  #ground {
    position: absolute; bottom: 0; left: 0; right: 0; height: 80px;
    background: linear-gradient(to bottom, #7BA428 0px, #7BA428 6px, #8B4513 6px, #5C3317 100%);
    z-index: 2;
  }
  #shadow {
    position: absolute; left: 105px; bottom: 68px; width: 50px; height: 14px;
    background: rgba(0,0,0,0.3); border-radius: 50%; filter: blur(2px);
    will-change: transform, opacity; z-index: 3;
  }
  #potato {
    position: absolute; left: 100px; bottom: 80px;
    width: 60px; height: 60px; font-size: 52px; line-height: 60px;
    text-align: center; will-change: bottom, transform;
    filter: drop-shadow(2px 4px 3px rgba(0,0,0,0.35)); z-index: 5;
  }
  .obstacle {
    position: absolute; width: 50px; height: 50px;
    font-size: 46px; line-height: 50px; text-align: center;
    filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.3)); z-index: 4;
  }
  .coin {
    position: absolute; width: 40px; height: 40px;
    font-size: 36px; line-height: 40px; text-align: center;
    animation: spin 0.8s linear infinite;
    filter: drop-shadow(0 0 6px rgba(255,215,0,0.7)); z-index: 4;
  }
  @keyframes spin { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.3); } }

  #hud {
    position: absolute; top: 16px; left: 20px;
    color: #223; font-size: 22px; font-weight: 800;
    text-shadow: 2px 2px 0 rgba(255,255,255,0.9);
    z-index: 10; line-height: 1.5;
  }
  #hud .label { color: #445; }
  #hud #score, #hud #best { color: #b8860b; }

  .overlay {
    position: absolute; inset: 0; z-index: 100;
    flex-direction: column; justify-content: center; align-items: center;
    text-align: center; padding: 20px; color: white;
  }
  #startScreen {
    display: flex;
    background: linear-gradient(135deg, rgba(20,20,50,0.8), rgba(60,20,90,0.8));
    backdrop-filter: blur(6px);
  }
  #gameOver { display: none; background: rgba(10,10,25,0.9); backdrop-filter: blur(6px); }
  #gameOver.show { display: flex; }

  .overlay h1 {
    font-size: 52px; margin-bottom: 16px;
    text-shadow: 0 4px 0 #000, 0 8px 20px rgba(0,0,0,0.5);
    letter-spacing: 1px;
  }
  .overlay .subtitle { font-size: 20px; margin-bottom: 28px; opacity: 0.85; }
  .overlay button {
    padding: 16px 60px; font-size: 24px; font-weight: 900;
    background: linear-gradient(#FFD700, #FFA500); color: #4a2c00;
    border: none; border-radius: 16px; cursor: pointer;
    box-shadow: 0 6px 0 #a86e00, 0 12px 24px rgba(0,0,0,0.5);
    transition: transform 0.1s, box-shadow 0.1s;
    font-family: inherit; letter-spacing: 1px; margin-bottom: 20px;
  }
  .overlay button:hover { filter: brightness(1.08); }
  .overlay button:active { transform: translateY(4px); box-shadow: 0 2px 0 #a86e00, 0 6px 12px rgba(0,0,0,0.5); }
  .overlay .controls { font-size: 16px; opacity: 0.7; margin-top: 10px; }
  .overlay .final { font-size: 24px; margin-bottom: 12px; }
  .overlay .newRecord {
    font-size: 26px; color: #FFD700; font-weight: 800;
    margin-bottom: 20px; animation: bounce 0.6s ease-in-out infinite alternate;
  }
  @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.1); } }
</style>
</head>
<body>
<div id="game">
  <div id="sun">☀️</div>
  <div id="cloud1">☁️</div>
  <div id="cloud2">☁️</div>
  <div id="ground"></div>
  <div id="shadow"></div>
  <div id="potato">🥔</div>

  <div id="hud">
    <div><span class="label">Счёт:</span> <span id="score">0</span></div>
    <div><span class="label">Рекорд:</span> <span id="best">0</span></div>
  </div>

  <div id="startScreen" class="overlay">
    <h1>🥔 ПОТАТО РАН</h1>
    <p class="subtitle">Прыгай, уворачивайся, собирай монеты!</p>
    <button id="playBtn">▶ ИГРАТЬ</button>
    <p class="controls">ПРОБЕЛ / КЛИК / ТАП — прыжок</p>
  </div>

  <div id="gameOver" class="overlay">
    <h1>💀 ИГРА ОКОНЧЕНА</h1>
    <p class="final">Твой счёт: <span id="finalScore">0</span></p>
    <p class="newRecord" id="newRecord" style="display:none">🏆 НОВЫЙ РЕКОРД!</p>
    <button id="restartBtn">🔄 ИГРАТЬ СНОВА</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  const gameEl = document.getElementById('game');
  const potatoEl = document.getElementById('potato');
  const shadowEl = document.getElementById('shadow');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const startScreen = document.getElementById('startScreen');
  const gameOverScreen = document.getElementById('gameOver');
  const finalScoreEl = document.getElementById('finalScore');
  const newRecordEl = document.getElementById('newRecord');
  const playBtn = document.getElementById('playBtn');
  const restartBtn = document.getElementById('restartBtn');

  const GROUND_Y = 80;
  const POTATO_X = 100;
  const POTATO_SIZE = 60;
  const GRAVITY = 0.9;
  const JUMP_V = 20;
  const OBST_W = 50;
  const OBST_H = 50;
  const COIN_SIZE = 40;
  const SPAWN_X = 820;

  let state = 'menu';
  let potatoY = GROUND_Y;
  let velocity = 0;
  let isJumping = false;
  let score = 0;
  let best = Number(localStorage.getItem('potatoBest')) || 0;
  let frame = 0;
  let spawnTimer = 0;
  let scoreTimer = 0;
  let obstacles = [];
  let coins = [];
  let lastTime = 0;
  let rafId = null;

  bestEl.textContent = best;

  // --- Звук ---
  let audioCtx = null;
  function beep(freq, dur, type, vol) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type || 'square';
      o.frequency.value = freq;
      g.gain.value = vol || 0.05;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur + 0.02);
    } catch (e) {}
  }

  function jump() {
    if (state !== 'playing' || isJumping) return;
    velocity = JUMP_V;
    isJumping = true;
    beep(600, 0.08, 'square', 0.04);
  }

  function spawnObstacle() {
    const types = ['🌵', '🪨', '🌰', '🧱', '💀'];
    const el = document.createElement('div');
    el.className = 'obstacle';
    el.textContent = types[(Math.random() * types.length) | 0];
    el.style.left = SPAWN_X + 'px';
    el.style.bottom = GROUND_Y + 'px';
    gameEl.appendChild(el);
    obstacles.push({ el: el, x: SPAWN_X });
  }

  function spawnCoin() {
    const el = document.createElement('div');
    el.className = 'coin';
    el.textContent = Math.random() < 0.5 ? '🪙' : '⭐';
    el.style.left = SPAWN_X + 'px';
    const heights = [GROUND_Y + 100, GROUND_Y + 150, GROUND_Y + 200];
    const bottom = heights[(Math.random() * heights.length) | 0];
    el.style.bottom = bottom + 'px';
    gameEl.appendChild(el);
    coins.push({ el: el, x: SPAWN_X, bottom: bottom });
  }

  function resetGame() {
    for (let i = 0; i < obstacles.length; i++) obstacles[i].el.remove();
    for (let i = 0; i < coins.length; i++) coins[i].el.remove();
    obstacles = [];
    coins = [];
    potatoY = GROUND_Y;
    velocity = 0;
    isJumping = false;
    score = 0;
    frame = 0;
    spawnTimer = 0;
    scoreTimer = 0;
    scoreEl.textContent = '0';
    potatoEl.style.bottom = potatoY + 'px';
    potatoEl.style.transform = 'rotate(0deg)';
    shadowEl.style.transform = 'scale(1)';
    shadowEl.style.opacity = '1';
  }

  function startGame() {
    if (rafId) cancelAnimationFrame(rafId);
    resetGame();
    startScreen.style.display = 'none';
    gameOverScreen.classList.remove('show');
    state = 'playing';
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
  }

  function gameOver() {
    state = 'gameover';
    beep(150, 0.4, 'sawtooth', 0.08);
    const isRecord = score > best;
    if (isRecord) {
      best = score;
      try { localStorage.setItem('potatoBest', String(best)); } catch (e) {}
      bestEl.textContent = best;
    }
    finalScoreEl.textContent = score;
    newRecordEl.style.display = isRecord ? 'block' : 'none';
    gameOverScreen.classList.add('show');
  }

  function loop(now) {
    if (state !== 'playing') return;

    const dtRaw = (now - lastTime) / 16.667;
    const dt = Math.max(0.1, Math.min(3, dtRaw));
    lastTime = now;
    frame += dt;

    // Физика
    if (isJumping || potatoY > GROUND_Y) {
      potatoY += velocity * dt;
      velocity -= GRAVITY * dt;
      if (potatoY <= GROUND_Y) {
        potatoY = GROUND_Y;
        velocity = 0;
        if (isJumping) beep(280, 0.06, 'square', 0.03);
        isJumping = false;
      }
    }
    potatoEl.style.bottom = potatoY + 'px';

    const airH = Math.max(0, potatoY - GROUND_Y);
    potatoEl.style.transform = 'rotate(' + (airH * 0.4) + 'deg)';
    const s = Math.max(0.4, 1 - airH / 350);
    shadowEl.style.transform = 'scale(' + s + ')';
    shadowEl.style.opacity = String(Math.max(0.2, 1 - airH / 250));

    const speed = Math.min(14, 5 + frame * 0.003) * dt;

    spawnTimer += dt;
    const interval = Math.max(50, 100 - frame * 0.03);
    if (spawnTimer >= interval) {
      spawnTimer = 0;
      const r = Math.random();
      if (r < 0.65) spawnObstacle();
      else if (r < 0.9) spawnCoin();
    }

    // Хитбоксы картошки
    const pL = POTATO_X + 10;
    const pR = POTATO_X + POTATO_SIZE - 10;
    const pB = potatoY + 5;
    const pT = potatoY + POTATO_SIZE - 5;

    // Враги
    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.x -= speed;
      o.el.style.left = o.x + 'px';

      const oL = o.x + 8;
      const oR = o.x + OBST_W - 8;
      const oB = GROUND_Y + 5;
      const oT = GROUND_Y + OBST_H - 8;

      if (pR > oL && pL < oR && pT > oB && pB < oT) {
        gameOver();
        return;
      }
      if (o.x < -100) {
        o.el.remove();
        obstacles.splice(i, 1);
      }
    }

    // Монеты
    for (let i = coins.length - 1; i >= 0; i--) {
      const c = coins[i];
      c.x -= speed;
      c.el.style.left = c.x + 'px';

      const cL = c.x, cR = c.x + COIN_SIZE;
      const cB = c.bottom, cT = c.bottom + COIN_SIZE;

      if (pR > cL && pL < cR && pT > cB && pB < cT) {
        c.el.remove();
        coins.splice(i, 1);
        score += 10;
        scoreEl.textContent = score;
        beep(900, 0.08, 'sine', 0.05);
        continue;
      }
      if (c.x < -100) {
        c.el.remove();
        coins.splice(i, 1);
      }
    }

    // Пассивный счёт
    scoreTimer += dt;
    if (scoreTimer >= 6) {
      scoreTimer -= 6;
      score++;
      scoreEl.textContent = score;
    }

    rafId = requestAnimationFrame(loop);
  }

  // Управление
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      e.preventDefault();
      if (state === 'menu' || state === 'gameover') startGame();
      else if (state === 'playing') jump();
    }
  });

  gameEl.addEventListener('pointerdown', function (e) {
    if (e.target.tagName === 'BUTTON') return;
    if (state === 'playing') {
      e.preventDefault();
      jump();
    }
  });

  playBtn.addEventListener('click', function (e) { e.stopPropagation(); startGame(); });
  restartBtn.addEventListener('click', function (e) { e.stopPropagation(); startGame(); });

  function fit() {
    const s = Math.min(window.innerWidth / 820, window.innerHeight / 520, 1);
    gameEl.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  potatoEl.style.bottom = GROUND_Y + 'px';
})();
</script>
</body>
</html>
